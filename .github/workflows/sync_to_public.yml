name: Sync to Public Repo

on:
  push:
    branches:
      - prerelease

jobs:
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # This prevents the default GitHub token from overriding your PAT
          persist-credentials: false 

      - name: Push to Public Mirror
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          # 1. Identity is required for amending
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # 2. Stage the removal of the workflows folder
          # The '|| true' ensures the script keeps going even if the folder is missing
          git rm -rf .github/workflows || true

          # 3. Check if the index is now identical to the previous commit (HEAD~1)
          # If 'git diff --cached --quiet HEAD~1' returns 0, it means no changes remain.
          if git diff --cached --quiet HEAD~1; then
            echo "No code changes left after cleaning. Pushing the previous state..."
            git remote add public https://oauth2:${PUBLIC_TOKEN}@github.com/Pico-Developer/SecureMR-Samples.git
            # We push the parent commit because the current one is now redundant
            git push public HEAD~1:prerelease --force
          else
            echo "Changes detected. Amending the commit to exclude workflows..."
            git commit --amend --no-edit
            git remote add public https://oauth2:${PUBLIC_TOKEN}@github.com/Pico-Developer/SecureMR-Samples.git
            git push public HEAD:prerelease --force
          fi